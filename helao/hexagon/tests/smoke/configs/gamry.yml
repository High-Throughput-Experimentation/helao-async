# LEGACY baseline gamry canary (PSTAT = gamry_server2). deployment: hte on both
# servers so this launches the legacy hte Gamry app; gamryhex.yml flips both to
# deployment: hexagon. gamry_canary.bat diffs the two -> a genuine
# legacy-vs-hexagon /openapi.json parity check. (Previously this file carried
# deployment: hexagon on both servers, making the canary a vacuous hex-vs-hex
# comparison.)
dummy: true
simulation: true
run_type: gamry
root: C:\INST_hlo_golden
alert_config_path: C:\INST_hlo\USER_CONFIG\alert_gamry.yml
servers:
  PSTAT:
    host: 127.0.0.1
    port: 8001
    group: action
    fast: gamry_server2
    deployment: hte
    action_vis: gamry_vis
    params:
      allow_no_sample: true
      dev_id: 0
      filterfreq_hz: 1000.0
      grounded: true
  ACTVIS:
    host: 127.0.0.1
    port: 5001
    group: visualizer
    bokeh: action_visualizer
    deployment: hte
    params:
      doc_name: 'PSTAT Visualizer'
      launch_browser: true