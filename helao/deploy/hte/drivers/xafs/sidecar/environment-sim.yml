name: easyxafs-sim
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.26
  - scipy=1.13
  - pandas=2.2
  - matplotlib=3.9
  - plotly=5.11
  - ipython
  - tqdm
  - xraydb=4.5
  - fastapi
  - uvicorn
  - pydantic=1.10
  - httpx
  - pytest
  - psutil
  - pip
  - pip:
      # fetch from note1: /mnt/k/experiments/xafs/python_wheels/ (see Task 2 notes)
      - ./easyxafs_xray_utils-1.1.0-py3-none-any.whl
