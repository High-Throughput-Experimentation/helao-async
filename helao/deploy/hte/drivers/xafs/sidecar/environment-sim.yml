name: easyxafs-sim
channels:
  - conda-forge
dependencies:
  - python=3.9
  - numpy=1.26
  - scipy=1.13
  - pandas=2.2
  - matplotlib=3.9
  - plotly=5.11
  - ipython
  - tqdm
  - xraydb=4.5
  - fastapi=0.125.0
  - starlette=0.49.3
  - uvicorn=0.39.0
  - pydantic=1.10.26
  - httpx
  - pytest
  - psutil=7.0.0
  - pip
# Manual steps after `conda env create` (proprietary, not committed). Obtain both
# from the instrument's easyxafs environment:
#  1. pip install <easyxafs_xray_utils 1.1.0 wheel>
#  2. copy the hklhop package dir into the env's site-packages (not on PyPI).
# easyxafs import path: ~/.local/share/easyxafs-sim-path/easyxafs -> easyxafs checkout,
# plus a .pth file in the env's site-packages pointing at that dir.
