dummy: false
simulation: false
experiment_libraries:
  - CSIL_exp
  - samples_exp
experiment_params:
  gamrychannelwait: -1
  gamrychannelsend: 1
sequence_libraries:
  - CCSI_seq
sequence_params:
  gamrychannelwait: -1
  gamrychannelsend: 1
run_type: ccsi
root: C:\INST_hlo\DATA
servers:
  ORCH:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8001
    group: orchestrator
    fast: async_orch2
    params:
      seqspec_parser_path: helao\specifications\last2weeks.py
      seqspec_folder_path: C:\INST_hlo\DATA\RUNS_SYNCED
    verbose: false
  OPERATOR:
    group: operator
    bokeh: standalone_operator
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 5002
    params:
      orch_key: ORCH
      poll_interval: 5
      plate_api: HTEPlateAPI
  # IO:
  #   host: hte-ccsi-02.htejcap.caltech.edu
  #   port: 8005
  #   group: action
  #   fast: galil_io
  #   params:
  #     galil_ip_str: 192.168.200.232
  #     dev_ai:
  #       cell_pressure_psi: 1
  #     dev_ao: {}
  #     dev_di:
  #       multichannel_valve_done: 1
  #       multichannel_valve_error: 2
  #     dev_do:
  #       gamry_aux: 1
  #       Thorlab_led: 7
  #     monitor_ai:
  #       cell_pressure_psi: 5.0
  NI:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8006
    group: action
    fast: nidaqmx_server
    control_vis: nidaqmx_control
    action_vis: nidaqmx_vis
    params:
      dev_gasvalve:
        1A: dev1/port0/line1
        1B: dev1/port0/line0
        7A: dev1/port1/line1
        7B: dev1/port1/line2
        9-co2supply: dev1/port2/line0
        10-n2push: dev1/port2/line1
      dev_multivalve:
        multi_CMD0: dev1/port1/line4
        multi_CMD1: dev1/port1/line5
        multi_CMD2: dev1/port1/line6
        multi_CMD3: dev1/port1/line7
        multichannel_valve_done: dev1/port2/line7
        multichannel_valve_error: dev1/port2/line6
      dev_liquidvalve:
        '2': dev1/port0/line2
        '3': dev1/port0/line3
        '4': dev1/port0/line4
        5A-cell: dev1/port0/line5
        5B-waste: dev1/port0/line6
        6A-waste: dev1/port0/line7
        6B: dev1/port1/line0
        '8': dev1/port1/line3
        #'9': dev1/port0/line12
      # dev_pump:
      #   RecirculatingPeriPump1: dev1/port0/line12
  SAMPLE:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8008
    group: action
    fast: sample_server
    action_vis: sample_vis
    params:
      positions:
        custom:
          cell1_we: cell
  VIS:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 5001
    group: visualizer
    bokeh: action_visualizer
    params:
      doc_name: CCSI Visualizer
  CONTROL:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 5005
    group: visualizer
    bokeh: control_visualizer
    params:
      doc_name: Engineering Controls
  LIVE:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 5004
    group: visualizer
    bokeh: live_visualizer
    params:
      doc_name: Sensor Visualizer
    verbose: false
  CO2SENSOR:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8012
    group: action
    fast: co2sensor_server
    live_vis: co2_vis
    params:
      port: COM12
      start_margin: 0
    verbose: false
  WORKSYRINGE:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8013
    group: action
    fast: syringe_server
    params:
      port: COM8
      pumps:
        zero:
          address: 0
          diameter: 20.05
  WATERSYRINGE:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8014
    group: action
    fast: syringe_server
    params:
      port: COM9
      pumps:
        one:
          address: 1
          diameter: 20.05
  CLEANSYRINGE:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8015
    group: action
    fast: syringe_server
    params:
      port: COM4
      pumps:
        one:
          address: 2
          diameter: 7.58
  DOSEPUMP:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8016
    group: action
    fast: diapump_server
    params:
      port: COM7
      address: 0
    verbose: true
  MFC:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8009
    group: action
    fast: mfc_server
    live_vis: mfc_vis
    params:
      devices:
        CO2:
          port: COM6
          unit_id: A
      co2_server_name: CO2SENSOR
    verbose: false
  N2MFC:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8019
    group: action
    fast: mfc_server
    live_vis: mfc_vis
    params:
      devices:
        N2:
          port: COM5
          unit_id: A


  CALC:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8011
    group: action
    fast: calc_server
    params: {}
    verbose: false
  SYNC:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 8010
    group: action
    fast: sync_server
    params:
      aws_profile: default
      testing: false
  UI:
    host: hte-ccsi-02.htejcap.caltech.edu
    port: 5110          # frontend; 5111 is the backend
    group: visualizer
    deployment: hte
    reflex: helao_ui
    params:
      pages: [live, action, operator, browser]
