dummy: true
simulation: true
experiment_libraries:
  - simulatews_exp
  - helao\deploy\test\experiments\TEST_exp.py
sequence_libraries:
  - helao\deploy\test\sequences\TEST_seq.py
run_type: simulation
root: c:/INST_hlo
servers:
  ORCH:
    host: 127.0.0.1
    port: 8001
    group: orchestrator
    fast: async_orch2
    params: {}
  OPERATOR:
    group: operator
    bokeh: standalone_operator
    host: 127.0.0.1
    port: 5001
    params:
      orch_key: ORCH
      poll_interval: 5
  SIM:
    host: 127.0.0.1
    port: 8002
    group: action
    fast: ws_simulator
    params: {}
  LIVE:
    host: 127.0.0.1
    port: 5003
    group: visualizer
    bokeh: sim_visualizer
    params:
      doc_name: Websocket Live Visualizer