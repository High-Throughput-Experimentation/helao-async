# P7e GATE config: goldenhexvis.yml's bokeh UI servers, one per standard
# module (OPERATOR standalone_operator, LIVE live_visualizer, ACTVIS
# action_visualizer), in a single group. Not a production config -- a mechanism
# proof.
dummy: true
simulation: true
show_debug: true
run_unit_tests: true
experiment_libraries:
  - simulatews_exp
  - helao/deploy/test/experiments/TEST_exp.py
sequence_libraries:
  - helao/deploy/test/sequences/TEST_seq.py
run_type: simulation
root: /home/dan/INST_hlo_hexgraft
servers:
  ORCH:
    host: 127.0.0.1
    port: 8001
    group: orchestrator
    fast: async_orch2
    params: {}
    prefinish_experiment_hooks:
      append_params: ["*"]
    prefinish_sequence_hooks:
      append_params: ["*"]
  OPERATOR:
    host: 127.0.0.1
    port: 5001
    group: operator
    bokeh: standalone_operator
    params:
      orch_key: ORCH
      doc_name: "Operator (hexagon generic graft)"
      poll_interval: 5
  SIM:
    host: 127.0.0.1
    port: 8002
    group: action
    fast: ws_simulator
    live_vis: wssim_live_vis
    params: {}
    prefinish_hooks:
      hlo_to_csv: ["*"]
  LIVE:
    host: 127.0.0.1
    port: 5002
    group: visualizer
    bokeh: live_visualizer
    params:
      doc_name: Websocket Live Visualizer
  ACTVIS:
    host: 127.0.0.1
    port: 5003
    group: visualizer
    bokeh: action_visualizer
    params:
      doc_name: Action Visualizer
  SYNC:
    host: 127.0.0.1
    port: 8010
    group: action
    fast: sim_db_server
    params:
      aws_bucket: helao-sim
      s3_record: true
