# P7e GATE config: goldenhexvis.yml with its bokeh UI servers moved onto the
# GENERIC config-driven grafts. OPERATOR and LIVE declare `bokeh: graft` +
# a top-level `legacy_module:`; ACTVIS stays on its explicit hexagon shim, so
# one launch proves the two routes coexist in a single group. This is the
# public stand-in for a PRIVATE deployment's flip: swap the two
# `legacy_module:` values for that deployment's own modules and nothing in this
# repo has to name it. Not a production config — a mechanism proof.
dummy: true
simulation: true
show_debug: true
run_unit_tests: true
experiment_libraries:
  - simulatews_exp
  - helao/deploy/test/experiments/TEST_exp.py
sequence_libraries:
  - helao/deploy/test/sequences/TEST_seq.py
run_type: simulation
root: /home/dan/INST_hlo_hexgraft
servers:
  ORCH:
    host: 127.0.0.1
    port: 8001
    group: orchestrator
    fast: async_orch2
    deployment: hexagon
    params: {}
    exp_postprocess_libs:
      - append_params
    seq_postprocess_libs:
      - append_params
  OPERATOR:
    host: 127.0.0.1
    port: 5001
    group: operator
    bokeh: graft
    deployment: hexagon
    legacy_module: helao.deploy.hte.servers.operator.standalone_operator
    params:
      orch_key: ORCH
      doc_name: "Operator (hexagon generic graft)"
      poll_interval: 5
  SIM:
    host: 127.0.0.1
    port: 8002
    group: action
    fast: ws_simulator
    deployment: hexagon
    live_vis: wssim_live_vis
    params: {}
    hlo_postprocess_libs:
      - hlo_to_csv
  LIVE:
    host: 127.0.0.1
    port: 5002
    group: visualizer
    bokeh: graft
    deployment: hexagon
    legacy_module: helao.deploy.hte.servers.visualizer.live_visualizer
    params:
      doc_name: Websocket Live Visualizer
  ACTVIS:
    host: 127.0.0.1
    port: 5003
    group: visualizer
    bokeh: action_visualizer
    deployment: hexagon
    params:
      doc_name: Action Visualizer
  SYNC:
    host: 127.0.0.1
    port: 8010
    group: action
    fast: sim_db_server
    deployment: hexagon
    params:
      aws_bucket: helao-sim
      s3_record: true
