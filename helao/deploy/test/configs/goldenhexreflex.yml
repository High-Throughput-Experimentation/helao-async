# P7f GATE config: goldenreflex.yml with its own `root:` (separate bundle).
#
# It differs from goldenreflex.yml only in `root:`, so this config's bundle and
# run tree do not share goldenreflex's -- a bundle is per (config, server).
#
# Not a production config -- a mechanism proof.
dummy: true
simulation: true
show_debug: true
run_unit_tests: true
experiment_libraries:
  - simulatews_exp
  - OERSIM_exp
  - helao/deploy/test/experiments/TEST_exp.py
sequence_libraries:
  - OERSIM_seq
  - helao/deploy/test/sequences/TEST_seq.py
run_type: simulation
root: /home/dan/INST_hlo_hexreflex
servers:
  ORCH:
    host: 127.0.0.1
    port: 8001
    group: orchestrator
    fast: async_orch2
    params: {}
  OPERATOR:
    host: 127.0.0.1
    port: 5001
    group: operator
    bokeh: standalone_operator
    params:
      orch_key: ORCH
      doc_name: "Operator (bokeh, unchanged)"
      poll_interval: 5
  SIM:
    host: 127.0.0.1
    port: 8002
    group: action
    fast: ws_simulator
    live_vis: wssim_panel
    control_vis: digital_out_control
    params:
      dev_do:
        gamry_aux: 1
        Thorlab_led: 7
        cell_valve: 2
        purge_valve: 3
  CPSIM:
    host: 127.0.0.1
    port: 8003
    group: action
    fast: cpsim_server
    action_vis: oersim_panel
    params:
      plate_id: 2750
  GPSIM:
    host: 127.0.0.1
    port: 8004
    group: action
    fast: gpsim_server
    live_vis: gpsim_panel
    params:
      random_seed: 12345
  UI:
    host: 127.0.0.1
    port: 5010
    group: visualizer
    # `reflex:` names the BUNDLE (resolve_bundle / build_reflex_bundle.py).
    reflex: helao_ui
    params:
      pages:
        - live
        - action
