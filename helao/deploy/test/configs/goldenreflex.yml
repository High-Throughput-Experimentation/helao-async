# helao/deploy/test/configs/goldenreflex.yml
# Reflex UI stack over the `test` deployment simulators, proving coexistence:
# the Bokeh standalone operator and the Reflex visualizer app run in the same
# group. Reflex servers occupy two ports (frontend, then backend), so UI at
# 5010 also claims 5011.
dummy: true
simulation: true
show_debug: true
run_unit_tests: true
experiment_libraries:
  - simulatews_exp
  - OERSIM_exp
  - helao/deploy/test/experiments/TEST_exp.py
sequence_libraries:
  - OERSIM_seq
  - helao/deploy/test/sequences/TEST_seq.py
run_type: simulation
root: /home/dan/INST_hlo_reflex
servers:
  ORCH:
    host: 127.0.0.1
    port: 8001
    group: orchestrator
    fast: async_orch2
    params: {}
  OPERATOR:
    host: 127.0.0.1
    port: 5001
    group: operator
    bokeh: standalone_operator
    params:
      orch_key: ORCH
      doc_name: "Operator (bokeh, unchanged)"
      poll_interval: 5
  SIM:
    host: 127.0.0.1
    port: 8002
    group: action
    fast: ws_simulator
    live_vis: wssim_panel
    params: {}
  # CPSIM and GPSIM exist so the browser check actually exercises all three
  # panels. Without CPSIM there is no `action_vis` server at all, so /action
  # renders empty and the ws_data path -- the one that shipped two Critical
  # defects -- is never touched by the only step that can prove rendering.
  CPSIM:
    host: 127.0.0.1
    port: 8003
    group: action
    fast: cpsim_server
    action_vis: oersim_panel
    params:
      plate_id: 2750
  # GPSIM is deliberately absent: gpsim_driver imports gpflow, which needs
  # tensorflow, and tensorflow has no Python 3.14 release. The server cannot
  # import at all (ModuleNotFoundError: gpflow), so including it would abort
  # the group at launch. That server and its driver are deprecated;
  # gpsim_panel is retained but unreachable from any launchable config.
  UI:
    host: 127.0.0.1
    port: 5010
    group: visualizer
    reflex: helao_ui
    params:
      pages:
        - live
        - action
