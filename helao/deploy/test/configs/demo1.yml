dummy: true
simulation: true
experiment_libraries:
  - OERSIM_exp
  - TEST_exp
sequence_libraries:
  - OERSIM_seq
  - TEST_seq
run_type: simulation
root: C:/INST_hlo
servers:
  ORCH:
    host: 127.0.0.1
    port: 8011
    group: orchestrator
    fast: async_orch2
    params: {}
  OPERATOR:
    group: operator
    bokeh: standalone_operator
    host: 127.0.0.1
    port: 5011
    params:
      orch_key: ORCH
      poll_interval: 5
  CPSIM:
    host: 127.0.0.1
    port: 8012
    group: action
    fast: cpsim_server
    action_vis: oersim_vis
    params:
      plate_id: 3851
  ACTVIS:
    host: 127.0.0.1
    port: 5012
    group: visualizer
    bokeh: action_visualizer
    params:
      doc_name: 'demo1: OER Simulation Visualizer'
      launch_browser: true
  GPSIM:
    host: 127.0.0.1
    port: 8013
    group: action
    fast: gpsim_server
    live_vis: gpsim_live_vis
    params:
      random_seed: 9999
  GPVIS:
    host: 127.0.0.1
    port: 5013
    group: visualizer
    bokeh: live_visualizer
    params:
      doc_name: GP Live Visualizer
      launch_browser: true
