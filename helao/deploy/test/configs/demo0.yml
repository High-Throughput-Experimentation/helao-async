dummy: true
simulation: true
experiment_libraries:
  - OERSIM_exp
sequence_libraries:
  - OERSIM_seq
run_type: simulation
root: C:/INST_hlo
servers:
  ORCH:
    host: 127.0.0.1
    port: 8001
    group: orchestrator
    fast: orchestrator
    deployment: framework
    params: {}
  OPERATOR:
    group: operator
    bokeh: standalone_operator
    deployment: framework
    host: 127.0.0.1
    port: 5001
    params:
      orch_key: ORCH
      poll_interval: 5
  CPSIM:
    host: 127.0.0.1
    port: 8002
    group: action
    fast: cpsim_server
    action_vis: oersim_vis
    params:
      plate_id: 2750
  ACTVIS:
    host: 127.0.0.1
    port: 5002
    group: visualizer
    bokeh: action_visualizer
    deployment: framework
    params:
      doc_name: 'demo0: OER Simulation Visualizer'
      launch_browser: true
  GPSIM:
    host: 127.0.0.1
    port: 8003
    group: action
    fast: gpsim_server
    live_vis: gpsim_live_vis
    params:
      random_seed: 9999
  GPVIS:
    host: 127.0.0.1
    port: 5003
    group: visualizer
    bokeh: live_visualizer
    deployment: framework
    params:
      doc_name: GP Live Visualizer
      launch_browser: true
