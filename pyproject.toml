[project]
name = "helao-async"
# Mirrors the newest `release/YYYY.MM.DD` git tag. The version that actually
# lands in every exp/prg/hlo file is the git commit hash, resolved at runtime
# by helao/core/version.py -- this field is metadata only, so it needs a bump
# whenever a new release tag is cut.
version = "2026.06.01"
description = "Caltech HTE group's distributed instrument control software (HELAO)"
requires-python = ">=3.14"

# Dependencies are deliberately NOT listed here, and there is no
# [build-system]: this repo is not pip-installable, it runs off PYTHONPATH
# (set into the conda env by setup_env.sh / setup_env.bat).
#
# The authoritative dependency lists are helao_dev_linux-64.yml and
# helao_dev_win-64.yml, which build the `helao` conda env. Duplicating them
# here would create a second source of truth that silently drifts -- and two
# entries could not be reproduced from PyPI anyway: pyMeCom and easy-biologic
# are installed from GitHub archive URLs rather than PyPI releases.

[tool.black]
# Pinned so black does NOT infer its target from [project].requires-python
# above. With the target left implicit, black reads ">=3.14" and starts
# emitting 3.14-only syntax -- e.g. it rewrites `except (A, B):` to the
# PEP 758 unparenthesized `except A, B:` in galil_motion_native.py, and
# wants to touch 18 more files than it otherwise would (126 -> 144 across
# helao/). Keeping the target at py312 holds the formatting baseline steady
# and keeps the source readable on older interpreters.
target-version = ["py312"]
# Five native re-body modules under helao/hexagon/adapters/native/ are
# VERBATIM, byte-identical copies of legacy code: four CARDS-P6 write
# collaborators (helao/core/servers/active_data_*.py, base_meta_writer.py) and
# the P2c sync driver (helao/core/drivers/data/sync_driver.py), pinned per-method
# by inspect.getsource source-parity tests for byte-parity. Several legacy
# collaborator modules are NOT black-formatted at line-length 88, so running
# black on either side of a pinned pair would reformat it and break the
# source-parity byte-identity. The hand-written native adapters
# (artifact_store, data_sink, ws_publish) are black-enforced like the rest of
# the repo (P2b-2 D2). (No other black config: line length stays the default
# 88.) sync_driver.py is the P2c re-body of
# helao/core/drivers/data/sync_driver.py (D1); its hand-written
# NativeSyncAdapter sibling (sync_adapter.py) stays black-enforced.
#
# BOTH SIDES of every pinned pair are excluded. This used to cover only the
# five native copies, which is half a guard: `black <changed-files>` during an
# import-sort sweep reformatted the LEGACY originals active_data_stream.py
# (32 lines) and active_finalizer.py (27 lines) and broke parity from the
# other direction. Two of the five legacy twins happen to be black-clean
# today, but they are listed anyway -- the invariant is "never reformatted",
# not "currently matches black's output", and a future black release can
# change its mind about any of them.
#
# Import SORTING is a different matter and is deliberately NOT excluded:
# `ruff check --select I` only moves import statements, which for these ten
# files all sit above the pinned region. Measured across all ten: every member
# body byte-identical, 8 of 10 at zero line delta. sync_fixtures'
# assert_region_holds_no_imports fails loud if that stops being true.
force-exclude = 'helao/(hexagon/adapters/native/(meta_writer|data_file|data_stream|finalizer|sync_driver)|core/servers/(base_meta_writer|active_data_file|active_data_stream|active_finalizer)|core/drivers/data/sync_driver)\.py'
